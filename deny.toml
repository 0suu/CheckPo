[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Vulnerability, unsound, notice, unmaintained, and yanked advisories are
# reviewed across the complete supported dependency graph.
unsound = "all"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2025-0075", reason = "Owner: maintainers. Review by 2026-10-01. Transitive through Tauri 2.11.2 urlpattern; no safe upgrade is currently available." },
    { id = "RUSTSEC-2025-0080", reason = "Owner: maintainers. Review by 2026-10-01. Transitive through Tauri 2.11.2 urlpattern; no safe upgrade is currently available." },
    { id = "RUSTSEC-2025-0081", reason = "Owner: maintainers. Review by 2026-10-01. Transitive through Tauri 2.11.2 urlpattern; no safe upgrade is currently available." },
    { id = "RUSTSEC-2025-0098", reason = "Owner: maintainers. Review by 2026-10-01. Transitive through Tauri 2.11.2 urlpattern; no safe upgrade is currently available." },
    { id = "RUSTSEC-2025-0100", reason = "Owner: maintainers. Review by 2026-10-01. Transitive through Tauri 2.11.2 urlpattern; no safe upgrade is currently available." },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "warn"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
