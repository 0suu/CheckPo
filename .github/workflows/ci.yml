name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Node.js
        if: runner.os == 'Windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check frontend JavaScript
        if: runner.os == 'Windows'
        run: |
          node --check src/CheckPo.Tauri/frontend/app.js
          node --check src/CheckPo.Tauri/frontend/app-checkpoints.js
          node --check src/CheckPo.Tauri/frontend/app-progress.js
          node --check src/CheckPo.Tauri/frontend/app-recovery.js
          node --check src/CheckPo.Tauri/frontend/config.js
          node --check src/CheckPo.Tauri/frontend/dialogs.js
          node --check src/CheckPo.Tauri/frontend/diff-tree.js
          node --check src/CheckPo.Tauri/frontend/frontend-state.js
          node --check src/CheckPo.Tauri/frontend/frontend-state.test.js
          node --check src/CheckPo.Tauri/frontend/i18n.js
          node --check src/CheckPo.Tauri/frontend/theme.js
          node --check src/CheckPo.Tauri/frontend/utils.js
          node --test src/CheckPo.Tauri/frontend/frontend-state.test.js

  required:
    name: CI required
    if: always()
    needs:
      - rust
    runs-on: windows-latest
    steps:
      - name: Require every CI matrix job to pass
        shell: bash
        env:
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          if [[ "$RUST_RESULT" != "success" ]]; then
            echo "Rust CI matrix result was: $RUST_RESULT" >&2
            exit 1
          fi
