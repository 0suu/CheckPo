name: Dependency audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/dependency-audit.yml
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "41 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  rustsec:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Cargo.lock
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
